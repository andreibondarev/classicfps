# Install as /etc/systemd/system/caddy.service.d/protocol47.conf, then
# `systemctl daemon-reload`. The Caddyfile reads the site domains from here.
[Service]
Environment=PROTOCOL47_DOMAIN=classicfps.app
# cs16.site was the first domain; X blocks links to it, so it only redirects.
Environment="PROTOCOL47_REDIRECT_DOMAINS=www.classicfps.app cs16.site www.cs16.site"
