# Install as /etc/systemd/system/caddy.service.d/protocol47.conf, then
# `systemctl daemon-reload`. The Caddyfile reads the site domains from here.
# Replace the example names with your own.
[Service]
Environment=PROTOCOL47_DOMAIN=play.example.com
# Optional: other names that should redirect to the main domain.
Environment="PROTOCOL47_REDIRECT_DOMAINS=www.play.example.com"
